<svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270" role="img" aria-label="JawabAI: WhatsApp AI support platform with a queue-based retrieval pipeline.">
<style>
@font-face{font-family:D;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:S;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:M;src:url(data:font/woff2;base64,) format("woff2")}
.d{font-family:D,system-ui,sans-serif;font-weight:700}.s{font-family:S,system-ui,sans-serif}.m{font-family:M,ui-monospace,monospace}
@keyframes cin{0%,5%{opacity:0;transform:translateY(6px)}15%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
@keyframes cdot{0%,25%{opacity:0}30%,50%{opacity:1}55%,100%{opacity:0}}
@keyframes cout{0%,50%{opacity:0;transform:translateY(6px)}60%,85%{opacity:1;transform:none}95%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cover{display:none}}
</style>
<rect width="420" height="270" fill="#f2f2ef"/>
<rect x="0" y="0" width="420" height="270" fill="#fafaf8"/>
<text x="28" y="44" class="m" font-size="14" fill="#5a5d64">2026 · Pending deployment</text>
<g style="animation:cin 4s cubic-bezier(.16,1,.3,1) infinite both"><rect x="280" y="24" width="72" height="22" fill="none" stroke="#121316"/><rect x="288" y="31" width="44" height="2" fill="#5a5d64"/><rect x="288" y="37" width="30" height="2" fill="#5a5d64"/></g>
<g style="animation:cdot 4s cubic-bezier(.16,1,.3,1) infinite both"><rect x="352" y="56" width="4" height="4" fill="#a3a5aa"/><rect x="360" y="56" width="4" height="4" fill="#a3a5aa"/><rect x="368" y="56" width="4" height="4" fill="#a3a5aa"/></g>
<g style="animation:cout 4s cubic-bezier(.16,1,.3,1) infinite both"><rect x="316" y="54" width="72" height="22" fill="#121316"/><rect x="324" y="61" width="50" height="2" fill="#fafaf8"/><rect x="324" y="67" width="36" height="2" fill="#fafaf8"/></g>
<text x="25" y="128" class="d" font-size="44" letter-spacing="-1.4" fill="#121316">JawabAI</text>
<text x="28" y="164" class="s" font-size="19" fill="#5a5d64">WhatsApp AI support platform with a</text>
<text x="28" y="190" class="s" font-size="19" fill="#5a5d64">queue-based retrieval pipeline.</text>
<line x1="28" y1="220.5" x2="392" y2="220.5" stroke="#d8d8d3"/>
<text x="28" y="249" class="m" font-size="14" fill="#5a5d64">Express 5 · PostgreSQL · BullMQ · ONNX</text>
<rect x="0.5" y="0.5" width="419" height="269" fill="none" stroke="#d8d8d3"/>
